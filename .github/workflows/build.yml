name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['website/**']
  # Every pull request, website-only ones too: main requires this check, and a
  # check that never runs would block the merge. The build itself is skipped
  # below when only the website changed.
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request supersedes a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and the main it merges into.
          fetch-depth: 2

      - name: Look for app changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! grep -qv '^website/' <<< "$changed"; then
              echo "Only the website changed, so there's no app to build."
              exit 0
            fi
          fi
          echo "app=true" >> "$GITHUB_OUTPUT"

      # The oldest Xcode the README promises. Releases use the newest.
      - name: Select Xcode
        if: steps.changes.outputs.app == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Debug
        if: steps.changes.outputs.app == 'true'
        run: |
          xcodebuild build \
            -project Vercelian.xcodeproj \
            -scheme Vercelian \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Release
        if: steps.changes.outputs.app == 'true'
        run: |
          xcodebuild build \
            -project Vercelian.xcodeproj \
            -scheme Vercelian \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      # Demo mode (DemoData) is for App Store screenshots and must never ship.
      # Swift stores short strings inside the machine code, so look for long
      # ones from the demo data, and require a string that must be there, so
      # the check can't pass by reading nothing.
      - name: Check that demo mode isn't in the Release build
        if: steps.changes.outputs.app == 'true'
        run: |
          strings build/Build/Products/Release/Vercelian.app/Contents/MacOS/Vercelian > strings.txt
          if ! grep -q 'Continue with Vercel' strings.txt; then
            echo "::error::Couldn't read the strings in the Release binary"
            exit 1
          fi
          if grep -E 'alex@example.com|Add express checkout' strings.txt; then
            echo "::error::The Release build contains demo mode"
            exit 1
          fi
