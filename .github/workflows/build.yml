name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Create Secrets.xcconfig
        run: |
          cat > Vercelian/Configuration/Secrets.xcconfig << 'EOF'
          OAUTH_CLIENT_ID = ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET = ${{ secrets.OAUTH_CLIENT_SECRET }}
          EOF

      - name: Build
        run: |
          xcodebuild build \
            -project Vercelian.xcodeproj \
            -scheme Vercelian \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true
