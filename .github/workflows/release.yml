name: Release

# Pushing a tag like v1.2.0 publishes a GitHub release with the app zipped.
# The App Store workflow runs on the same tag.

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Check the tag matches the app version
        run: |
          version=$(xcodebuild -project Vercelian.xcodeproj -scheme Vercelian -configuration Release -showBuildSettings \
            | awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version ($version). Update MARKETING_VERSION first."
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild build \
            -project Vercelian.xcodeproj \
            -scheme Vercelian \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package
        working-directory: build/Build/Products/Release
        run: |
          ditto -c -k --keepParent Vercelian.app Vercelian.zip
          shasum -a 256 Vercelian.zip > Vercelian.zip.sha256
          cat Vercelian.zip.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Build/Products/Release/Vercelian.zip
            build/Build/Products/Release/Vercelian.zip.sha256
          generate_release_notes: true
